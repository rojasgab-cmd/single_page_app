<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get a random, safe-for-work joke whenever you need a laugh."
    />
    <title>A Little Laugh</title>
    <link rel="stylesheet" href="style.css" />
    <script src="utilities.js" defer></script>
  </head>
  <body>
    <main class="joke-app">
      <p class="eyebrow">A little break</p>
      <h1>Need a laugh?</h1>
      <p class="intro">Here’s a safe-for-work joke to brighten your day.</p>

      <section class="joke-card" aria-label="Random joke">
        <p id="joke-category" class="joke-category">YOUR DAILY DOSE OF FUN</p>
        <div id="joke-content" class="joke-content" aria-live="polite">
          <p>Click the button for a fresh joke.</p>
        </div>
      </section>

      <button id="get-joke" type="button">Get a joke</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
